<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#020307">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Deep Space Laser Gallery</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020307;color:#fff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}
  body{position:fixed;inset:0}
  #app{position:absolute;inset:0;background:#020307}
  #game{position:absolute;inset:0;overflow:hidden;cursor:crosshair;touch-action:none;user-select:none}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hud{position:absolute;z-index:5;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;pointer-events:none}
  #hud.hidden,#hint.hidden{display:none}
  #stats{display:inline-block;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:8px 10px;font-size:14px;backdrop-filter:blur(5px)}
  button{min-width:150px;min-height:56px;border:1px solid rgba(100,255,150,.7);background:rgba(8,22,14,.9);color:white;border-radius:14px;padding:12px 22px;font:800 22px system-ui;box-shadow:0 0 22px rgba(53,255,105,.22);touch-action:manipulation}
  .screen{position:absolute;z-index:10;inset:0;display:none;align-items:center;justify-content:center;background:rgba(1,2,5,.72);backdrop-filter:blur(3px)}
  .screen.show{display:flex}
  .endcard{text-align:center;background:rgba(5,9,16,.9);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:24px;min-width:230px;font-size:18px;line-height:1.8}
  .endcard .over{font-size:28px;font-weight:900;letter-spacing:.08em}
  .endcard button{margin-top:12px;font-size:18px}
  #hint{position:absolute;z-index:4;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);white-space:nowrap;font-size:11px;color:rgba(255,255,255,.55);pointer-events:none}
  @media (max-width:380px){#stats{font-size:12px;padding:7px 8px}}
</style>
</head>
<body>
<div id="app">
  <div id="game">
    <canvas id="canvas"></canvas>
    <div id="hud" class="hidden">
      <div id="stats">Score: <strong id="score">0</strong> &nbsp; Hits: <strong id="hits">0</strong> &nbsp; Time: <strong id="time">30.0</strong></div>
    </div>
    <div id="startScreen" class="screen show"><button id="play" type="button">Play</button></div>
    <div id="endScreen" class="screen"><div class="endcard"><div class="over">TIME!</div><div>Final Score: <strong id="finalScore">0</strong></div><div>Hits: <strong id="finalHits">0</strong></div><button id="playAgain" type="button">Play Again</button></div></div>
    <div id="hint" class="hidden">Tap to aim and fire</div>
  </div>
</div>
<script>
(()=>{
const box=document.getElementById('game'),cv=document.getElementById('canvas'),x=cv.getContext('2d');
const scoreE=document.getElementById('score'),hitsE=document.getElementById('hits'),timeE=document.getElementById('time');
const hud=document.getElementById('hud'),hint=document.getElementById('hint'),startScreen=document.getElementById('startScreen'),endScreen=document.getElementById('endScreen');
const playB=document.getElementById('play'),playAgainB=document.getElementById('playAgain'),finalScoreE=document.getElementById('finalScore'),finalHitsE=document.getElementById('finalHits');

let W=0,H=0,D=1,last=0,spawn=.25,score=0,hits=0,running=false,timeLeft=30;
let targets=[],shots=[],bursts=[],stars=[],angle=-Math.PI/2,flash=0,aimX=0,aimY=0;

function resize(){
  W=innerWidth; H=innerHeight; D=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(W*D); cv.height=Math.round(H*D);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  x.setTransform(D,0,0,D,0,0);
  stars=Array.from({length:Math.max(130,Math.round(W*H/3000))},()=>({
    x:Math.random(),y:Math.random(),r:.25+Math.random()*1.2,a:.15+Math.random()*.6
  }));
  if(!aimX){aimX=W/2;aimY=H*.2}
}

function value(t){const bonus=Math.round((t.type.base*.5*Math.min(t.p,1))/50)*50;return Math.min(1500,t.type.base+bonus)}
function col(v){
  if(v<=250)return['#27a8ff','#a5dcff'];
  if(v<=450)return['#26dc7d','#a0ffc8'];
  if(v<=650)return['#ffd52e','#fff0a1'];
  if(v<=850)return['#ff832e','#ffc39a'];
  if(v<=950)return['#ff3c55','#ff9aa7'];
  return['#c45cff','#e6b3ff'];
}

function pickType(){
  const r=Math.random();
  if(r<.48)return{kind:'asteroid',label:'Asteroid',base:100};
  if(r<.76)return{kind:'satellite',label:'Satellite',base:250};
  if(r<.91)return{kind:'fighter',label:'Alien Fighter',base:500};
  if(r<.98)return{kind:'comet',label:'Comet',base:750};
  return{kind:'ufo',label:'Rare UFO',base:1000};
}
function addTarget(){
  const side=Math.floor(Math.random()*4),pad=48;
  let sx,sy;
  if(side===0){sx=Math.random()*W;sy=-pad}
  else if(side===1){sx=W+pad;sy=Math.random()*H*.86}
  else if(side===2){sx=Math.random()*W;sy=H+pad}
  else{sx=-pad;sy=Math.random()*H*.86}
  const destX=W*(.25+Math.random()*.5),destY=H*(.18+Math.random()*.48),type=pickType();
  targets.push({sx,sy,x:sx,y:sy,dx:destX-sx,dy:destY-sy,p:0,speed:.12+Math.random()*.08,sr:30+Math.random()*10,r:34,w:Math.random()*6.28,type});
}
function pivot(){return{x:W/2,y:H-Math.max(60,Math.min(82,H*.08))}}
function setAim(px,py){
  aimX=px; aimY=py;
  const p=pivot(),a=Math.atan2(py-p.y,px-p.x);
  angle=Math.max(-Math.PI+.15,Math.min(-.15,a));
}
function barrelLength(){return Math.max(74,Math.min(92,H*.105))}
function tip(){
  const p=pivot(),l=barrelLength();
  return{x:p.x+Math.cos(angle)*l,y:p.y+Math.sin(angle)*l};
}
function fire(px,py){
  if(!running)return;
  setAim(px,py);
  const q=tip(),dx=px-q.x,dy=py-q.y,l=Math.hypot(dx,dy)||1;
  shots.push({x:q.x,y:q.y,vx:dx/l*760,vy:dy/l*760,life:1.5,trail:[]});
  flash=.1;
}

box.addEventListener('pointermove',e=>{
  if(!running||e.pointerType==='touch')return;
  setAim(e.clientX,e.clientY);
});
box.addEventListener('pointerdown',e=>{
  if(!running)return;
  e.preventDefault();
  fire(e.clientX,e.clientY);
},{passive:false});

function startGame(){
  score=hits=0;timeLeft=30;targets=[];shots=[];bursts=[];spawn=.15;angle=-Math.PI/2;running=true;
  scoreE.textContent='0';hitsE.textContent='0';timeE.textContent='30.0';
  startScreen.classList.remove('show');endScreen.classList.remove('show');hud.classList.remove('hidden');hint.classList.remove('hidden');
  last=performance.now();
}
function endGame(){
  running=false;targets=[];shots=[];
  finalScoreE.textContent=score;finalHitsE.textContent=hits;
  hud.classList.add('hidden');hint.classList.add('hidden');endScreen.classList.add('show');
}
playB.addEventListener('click',startGame);
playAgainB.addEventListener('click',startGame);
function update(dt){
  if(!running)return;
  timeLeft-=dt;
  if(timeLeft<=0){timeLeft=0;timeE.textContent='0.0';endGame();return}
  timeE.textContent=timeLeft.toFixed(1);
  flash=Math.max(0,flash-dt);
  spawn-=dt;
  if(spawn<=0){addTarget();spawn=.7+Math.random()*.7}
  targets.forEach(t=>{
    t.p+=t.speed*dt;
    const e=1-Math.pow(1-Math.min(t.p,1),1.08);
    t.x=t.sx+t.dx*e+Math.sin(t.w+t.p*9)*3;
    t.y=t.sy+t.dy*e;
    t.r=Math.max(7,t.sr*(1-t.p*.8));
  });
  targets=targets.filter(t=>t.p<1.01);
  shots.forEach(s=>{
    s.trail.unshift({x:s.x,y:s.y});
    if(s.trail.length>11)s.trail.pop();
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;
  });
  for(let i=shots.length-1;i>=0;i--){
    const j=targets.findIndex(t=>Math.hypot(shots[i].x-t.x,shots[i].y-t.y)<t.r+5);
    if(j>=0){
      const t=targets[j],v=value(t),c=col(v);
      bursts.push({x:t.x,y:t.y,r:5,life:.5,v,c:c[0]});
      targets.splice(j,1);shots.splice(i,1);
      hits++;score+=v;scoreE.textContent=score;hitsE.textContent=hits;
    }
  }
  shots=shots.filter(s=>s.life>0&&s.x>-60&&s.x<W+60&&s.y>-60&&s.y<H+60);
  bursts.forEach(b=>{b.life-=dt;b.r+=80*dt});
  bursts=bursts.filter(b=>b.life>0);
}

function cannon(){
  const p=pivot(),scale=Math.max(.82,Math.min(1.12,W/390));
  x.save();x.translate(p.x,p.y);x.scale(scale,scale);
  let metal=x.createLinearGradient(-70,0,70,0);
  metal.addColorStop(0,'#101620');metal.addColorStop(.25,'#536174');metal.addColorStop(.5,'#202a37');metal.addColorStop(.75,'#536174');metal.addColorStop(1,'#101620');
  x.fillStyle='#080d14';x.strokeStyle='#8390a1';x.lineWidth=2;
  x.beginPath();x.ellipse(0,28,67,23,0,0,Math.PI*2);x.fill();x.stroke();
  x.fillStyle=metal;x.beginPath();x.moveTo(-57,24);x.lineTo(-48,-7);x.lineTo(-33,-20);x.lineTo(33,-20);x.lineTo(48,-7);x.lineTo(57,24);x.closePath();x.fill();x.stroke();
  for(const s of[-1,1]){x.fillStyle='#07140c';x.strokeStyle='#35ff69';x.shadowBlur=8;x.shadowColor='#35ff69';x.fillRect(s*47-5,2,10,21);x.strokeRect(s*47-5,2,10,21)}
  x.shadowBlur=0;x.fillStyle='#26313f';x.strokeStyle='#a8b3c1';x.beginPath();x.arc(0,0,28,0,Math.PI*2);x.fill();x.stroke();
  x.fillStyle='#0a1018';x.beginPath();x.arc(0,0,17,0,Math.PI*2);x.fill();x.stroke();
  x.fillStyle='#35ff69';x.shadowBlur=12;x.shadowColor='#35ff69';x.beginPath();x.arc(0,0,7,0,Math.PI*2);x.fill();x.restore();

  x.save();x.translate(p.x,p.y);x.rotate(angle+Math.PI/2);x.scale(scale,scale);
  x.fillStyle='#354252';x.strokeStyle='#b9c3cf';x.lineWidth=2;
  x.beginPath();x.moveTo(-13,4);x.lineTo(-10,-65);x.lineTo(-7,-82);x.lineTo(7,-82);x.lineTo(10,-65);x.lineTo(13,4);x.closePath();x.fill();x.stroke();
  x.fillStyle='#35ff69';x.shadowBlur=11;x.shadowColor='#35ff69';x.fillRect(-3,-77,6,67);
  x.shadowBlur=0;x.fillStyle='#111923';x.strokeStyle='#6f7c8d';x.fillRect(-10,-53,20,8);x.strokeRect(-10,-53,20,8);
  if(flash){x.globalAlpha=flash/.1;x.fillStyle='#eaffef';x.shadowBlur=28;x.shadowColor='#35ff69';x.beginPath();x.arc(0,-85,11,0,Math.PI*2);x.fill()}
  x.restore();
}

function draw(){
  x.clearRect(0,0,W,H);
  const g=x.createRadialGradient(W*.5,H*.38,10,W*.5,H*.38,Math.max(W,H)*.75);
  g.addColorStop(0,'#09101f');g.addColorStop(.5,'#03060d');g.addColorStop(1,'#010204');
  x.fillStyle=g;x.fillRect(0,0,W,H);
  stars.forEach(s=>{x.globalAlpha=s.a;x.fillStyle='#fff';x.beginPath();x.arc(s.x*W,s.y*H,s.r,0,Math.PI*2);x.fill()});x.globalAlpha=1;

  targets.forEach(t=>{
    const v=value(t),c=col(Math.min(v,1000));
    x.save();x.translate(t.x,t.y);x.shadowBlur=13;x.shadowColor=c[0];x.strokeStyle=c[0];x.fillStyle=c[0]+'55';x.lineWidth=2;
    const r=t.r,k=t.type.kind;
    if(k==='asteroid'){
      x.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=r*(.72+(i%3)*.1),px=Math.cos(a)*rr,py=Math.sin(a)*rr;i?x.lineTo(px,py):x.moveTo(px,py)}x.closePath();x.fill();x.stroke();
      x.shadowBlur=0;x.beginPath();x.arc(-r*.2,-r*.12,r*.16,0,7);x.stroke();x.beginPath();x.arc(r*.25,r*.18,r*.11,0,7);x.stroke();
    }else if(k==='satellite'){
      x.fillRect(-r*.18,-r*.45,r*.36,r*.9);x.strokeRect(-r*.18,-r*.45,r*.36,r*.9);
      x.fillRect(-r,-r*.28,r*.7,r*.56);x.strokeRect(-r,-r*.28,r*.7,r*.56);x.fillRect(r*.3,-r*.28,r*.7,r*.56);x.strokeRect(r*.3,-r*.28,r*.7,r*.56);
    }else if(k==='fighter'){
      x.beginPath();x.moveTo(0,-r);x.lineTo(r*.75,r*.65);x.lineTo(0,r*.35);x.lineTo(-r*.75,r*.65);x.closePath();x.fill();x.stroke();
      x.beginPath();x.moveTo(0,-r*.7);x.lineTo(0,r*.35);x.stroke();
    }else if(k==='comet'){
      x.globalAlpha=.5;x.beginPath();x.moveTo(-r*.4,r*.15);x.lineTo(-r*2.1,r*.7);x.lineTo(-r*.8,-r*.3);x.closePath();x.fill();x.globalAlpha=1;
      x.beginPath();x.arc(0,0,r*.65,0,7);x.fill();x.stroke();
    }else{
      x.beginPath();x.ellipse(0,0,r,r*.42,0,0,7);x.fill();x.stroke();x.beginPath();x.arc(0,-r*.2,r*.4,Math.PI,0);x.fill();x.stroke();
      for(let i=-2;i<=2;i++){x.fillStyle=c[1];x.beginPath();x.arc(i*r*.32,r*.08,2.3,0,7);x.fill()}
    }
    x.shadowBlur=0;x.fillStyle='#fff';x.strokeStyle='#080808';x.lineWidth=3;x.font='800 '+Math.max(9,Math.min(14,r*.46))+'px system-ui';x.textAlign='center';x.textBaseline='middle';x.strokeText(v,0,r+12);x.fillText(v,0,r+12);x.restore();
  });

  shots.forEach(s=>{
    x.save();x.lineCap='round';
    for(let i=s.trail.length-1;i>0;i--){const a=1-i/s.trail.length;x.globalAlpha=a*.7;x.strokeStyle='#2cff63';x.lineWidth=1+a*5;x.shadowBlur=12;x.shadowColor='#2cff63';x.beginPath();x.moveTo(s.trail[i].x,s.trail[i].y);x.lineTo(s.trail[i-1].x,s.trail[i-1].y);x.stroke()}
    x.globalAlpha=1;x.fillStyle='#e5ffeb';x.shadowBlur=18;x.shadowColor='#35ff69';x.beginPath();x.arc(s.x,s.y,4,0,Math.PI*2);x.fill();x.restore();
  });

  bursts.forEach(b=>{x.save();x.globalAlpha=b.life/.5;x.strokeStyle=b.c;x.shadowBlur=12;x.shadowColor=b.c;x.lineWidth=3;x.beginPath();x.arc(b.x,b.y,b.r,0,Math.PI*2);x.stroke();x.fillStyle='#fff';x.shadowBlur=0;x.font='700 14px system-ui';x.textAlign='center';x.fillText('+'+b.v,b.x,b.y-b.r-5);x.restore()});
  cannon();
}

function loop(ts){const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;update(dt);draw();requestAnimationFrame(loop)}
resize();addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,150));requestAnimationFrame(loop);
})();
</script>
</body>
</html>
